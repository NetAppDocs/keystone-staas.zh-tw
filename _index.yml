  title: Keystone 文件
  summary: Keystone STaaS 是 NetApp Keystone 平台下的訂閱產品，透過隨用隨付模式提供檔案、區塊和物件儲存服務。
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystone 是 NetApp 的以服務形式的儲存設備平台。Keystone 以服務形式的儲存設備 (STaaS) 是 Keystone
    旗下的訂閱產品，透過隨用隨付模式提供檔案、區塊和物件儲存服務。Keystone STaaS 使組織能夠以營運費用來使用儲存設備，而無需預先進行資本投資。
